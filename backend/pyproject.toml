[project]
name = "connect-web-backend"
version = "0.1.0"
description = "FastAPI backend for Connect_Web factory sensor monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.12,<0.116",
    "sqlalchemy>=2.0.40,<3",
    "psycopg[binary]>=3.2.6,<4",
    "alembic>=1.15.2,<2",
    "pydantic-settings>=2.8.1,<3",
    "uvicorn[standard]>=0.34.0,<0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=8.3.5,<9",
    "ruff>=0.11.2,<0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

