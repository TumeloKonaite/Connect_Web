<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-label="Sensor Data Explorer text observation table screenshot">
  <defs>
    <style>
      .bg { fill: #f3f6f4; }
      .card { fill: #ffffff; stroke: #e6ece8; stroke-width: 1; rx: 7px; }
      .eyebrow { fill: #728078; font: 600 9px monospace; letter-spacing: 1.5px; }
      .h2 { fill: #263c31; font: 700 17px sans-serif; }
      .h3 { fill: #22382e; font: 600 14px sans-serif; }
      .muted { fill: #7e8d84; font: 400 11px sans-serif; }
      .label { fill: #66776d; font: 500 11px sans-serif; }
      .input { fill: #fbfcfb; stroke: #dfe8e2; rx: 4px; }
      .input-text { fill: #294238; font: 400 11px sans-serif; }
      .btn { fill: #1b7657; rx: 4px; }
      .btn-text { fill: #ffffff; font: 600 12px sans-serif; }
      .chip { fill: #ffffff; stroke: #e4ece7; rx: 5px; }
      .chip-k { fill: #84928a; font: 600 8px monospace; }
      .chip-v { fill: #263c31; font: 600 10px sans-serif; }
      .pill-num { fill: #e8f4ec; rx: 3px; }
      .pill-num-t { fill: #2b6f51; font: 600 8px monospace; }
      .pill-txt { fill: #fbf3e4; rx: 3px; }
      .pill-txt-t { fill: #7a5c29; font: 600 8px monospace; }
      .th-bg { fill: #f4f8f5; }
      .th-text { fill: #485d51; font: 600 10px monospace; letter-spacing: 0.5px; }
      .td-time { fill: #4b6154; font: 500 11px monospace; }
      .badge-m { fill: #fbf3e4; rx: 4px; }
      .badge-m-t { fill: #8a6421; font: 600 10px monospace; }
      .badge-l { fill: #eaf5ee; rx: 4px; }
      .badge-l-t { fill: #2b6f51; font: 600 10px monospace; }
      .badge-h { fill: #fbeee9; rx: 4px; }
      .badge-h-t { fill: #96483b; font: 600 10px monospace; }
    </style>
  </defs>

  <rect width="1120" height="580" class="bg"/>

  <!-- Left Query Setup Form Card -->
  <rect x="28" y="24" width="350" height="532" class="card"/>
  <text x="50" y="54" class="eyebrow">QUERY SETUP</text>
  <text x="50" y="74" class="h3">Choose what to explore</text>
  <text x="328" y="64" class="chip-k">01 — 04</text>

  <text x="50" y="108" class="label">Monitoring device</text>
  <rect x="50" y="116" width="306" height="36" class="input"/>
  <text x="62" y="138" class="input-text">Demonstration Machine Monitor 1 · demo-device-1</text>

  <text x="50" y="176" class="label">Parameter</text>
  <rect x="50" y="184" width="306" height="36" class="input"/>
  <text x="62" y="206" class="input-text">Product Type (text)</text>

  <text x="50" y="244" class="label">Start date &amp; time</text>
  <rect x="50" y="252" width="146" height="36" class="input"/>
  <text x="60" y="274" class="input-text">2025-01-01 00:00</text>

  <text x="210" y="244" class="label">End date &amp; time</text>
  <rect x="210" y="252" width="146" height="36" class="input"/>
  <text x="220" y="274" class="input-text">2025-01-02 00:00</text>

  <rect x="50" y="308" width="306" height="34" fill="#f5f8f5" rx="4"/>
  <text x="62" y="329" class="muted">◷ Times use your local timezone and are sent in UTC.</text>

  <rect x="50" y="356" width="306" height="40" class="btn"/>
  <text x="168" y="380" class="btn-text">View data →</text>

  <!-- Right Observation Results Card -->
  <rect x="396" y="24" width="696" height="532" class="card"/>
  <text x="418" y="52" class="eyebrow">OBSERVATION RESULTS</text>
  <text x="418" y="74" class="h2">Product Type</text>
  <rect x="982" y="48" width="90" height="22" class="pill-num"/>
  <text x="992" y="62" class="pill-num-t">5 ROWS SHOWN</text>
  <line x1="396" y1="88" x2="1092" y2="88" stroke="#edf1ee"/>

  <!-- Context Chips -->
  <rect x="397" y="89" width="694" height="42" fill="#fafcfb"/>
  <rect x="414" y="97" width="224" height="26" class="chip"/>
  <text x="422" y="113" class="chip-k">DEVICE</text>
  <text x="462" y="113" class="chip-v">Demonstration Machine Monitor 1</text>

  <rect x="646" y="97" width="184" height="26" class="chip"/>
  <text x="654" y="113" class="chip-k">PARAMETER</text>
  <text x="712" y="113" class="chip-v">Product Type</text>
  <rect x="790" y="102" width="32" height="16" class="pill-txt"/>
  <text x="795" y="113" class="pill-txt-t">TEXT</text>

  <rect x="838" y="97" width="236" height="26" class="chip"/>
  <text x="846" y="113" class="chip-k">TIME PERIOD</text>
  <text x="910" y="113" class="chip-v">Jan 01, 00:00 — Jan 02, 00:00</text>
  <line x1="396" y1="131" x2="1092" y2="131" stroke="#edf1ee"/>

  <!-- Table Section Header -->
  <text x="418" y="158" class="h3">Product Type</text>
  <text x="418" y="174" class="muted">Timestamped observation table · 5 records in chronological order</text>

  <!-- Table Box -->
  <rect x="418" y="190" width="654" height="240" fill="#ffffff" stroke="#e8efeb" rx="6"/>
  <rect x="419" y="191" width="652" height="36" class="th-bg"/>
  <text x="434" y="213" class="th-text">OBSERVATION TIMESTAMP</text>
  <text x="720" y="213" class="th-text">RECORDED PRODUCT TYPE</text>
  <line x1="418" y1="227" x2="1072" y2="227" stroke="#e3ebe6"/>

  <!-- Row 1 -->
  <text x="434" y="252" class="td-time">Jan 01, 2025, 00:00</text>
  <rect x="720" y="238" width="28" height="20" class="badge-m"/>
  <text x="730" y="252" class="badge-m-t">M</text>
  <line x1="418" y1="267" x2="1072" y2="267" stroke="#edf1ee"/>

  <!-- Row 2 -->
  <rect x="419" y="268" width="652" height="39" fill="#fbfdfc"/>
  <text x="434" y="292" class="td-time">Jan 01, 2025, 00:20</text>
  <rect x="720" y="278" width="28" height="20" class="badge-l"/>
  <text x="731" y="292" class="badge-l-t">L</text>
  <line x1="418" y1="307" x2="1072" y2="307" stroke="#edf1ee"/>

  <!-- Row 3 -->
  <text x="434" y="332" class="td-time">Jan 01, 2025, 00:40</text>
  <rect x="720" y="318" width="28" height="20" class="badge-l"/>
  <text x="731" y="332" class="badge-l-t">L</text>
  <line x1="418" y1="347" x2="1072" y2="347" stroke="#edf1ee"/>

  <!-- Row 4 -->
  <rect x="419" y="348" width="652" height="39" fill="#fbfdfc"/>
  <text x="434" y="372" class="td-time">Jan 01, 2025, 01:00</text>
  <rect x="720" y="358" width="28" height="20" class="badge-h"/>
  <text x="730" y="372" class="badge-h-t">H</text>
  <line x1="418" y1="387" x2="1072" y2="387" stroke="#edf1ee"/>

  <!-- Row 5 -->
  <text x="434" y="412" class="td-time">Jan 01, 2025, 01:20</text>
  <rect x="720" y="398" width="28" height="20" class="badge-m"/>
  <text x="730" y="412" class="badge-m-t">M</text>

  <!-- Pagination Footer -->
  <line x1="396" y1="482" x2="1092" y2="482" stroke="#edf1ee"/>
  <text x="418" y="502" class="chip-v">Page 1 · Showing 1–5</text>
  <text x="418" y="516" class="muted">All 5 matching observations shown</text>
  <rect x="926" y="492" width="70" height="26" class="input"/>
  <text x="938" y="509" class="muted">← Previous</text>
  <rect x="1004" y="492" width="68" height="26" class="input"/>
  <text x="1020" y="509" class="muted">Next →</text>
</svg>

